[project]
name = "chatbi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BY33019", email = "3054055127@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.4",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "openai>=3.7.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
chatbi-project = "chatbi_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
